server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # SSE must not inherit the short timeout or buffering used by one-shot API calls.
    # A buffered stream looks connected but delivers nothing until the buffer fills, and
    # a read timeout shorter than the heartbeat kills an otherwise healthy connection.
    location = /api/v1/sync/stream {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
    }
    location /health/ {
        proxy_pass http://api:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
