server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: octoflow-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:octoflow}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:octoflow}
    password: ${DB_PASSWORD:octoflow_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OctoFlowHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    csrf:
      enabled: true

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /api/v1/openapi.json
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# OctoFlow Application Domain Configuration
app:
  security:
    cors-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "capacitor://localhost"
      - "https://localhost"
    session-timeout-minutes: 60
    cookie-secure: ${COOKIE_SECURE:false}

  sync:
    mode: ${INVENTORY_SYNC_MODE:eda}
    poll-interval-ms: 5000
    outbox-batch-size: 100
    reconciliation-interval-minutes: 1

  channels:
    shopify:
      enabled: ${SHOPIFY_ENABLED:false}
      shop-domain: ${SHOPIFY_SHOP_DOMAIN:}
      api-version: ${SHOPIFY_API_VERSION:2026-10}
      write-enabled: ${SHOPIFY_WRITE_ENABLED:false}
    woocommerce:
      enabled: ${WOOCOMMERCE_ENABLED:false}
      base-url: ${WOOCOMMERCE_BASE_URL:http://localhost:8090}
      write-enabled: ${WOOCOMMERCE_PRODUCT_WRITE_ENABLED:false}
    ebay:
      enabled: ${EBAY_ENABLED:false}
      environment: ${EBAY_ENVIRONMENT:sandbox}
    simulator:
      enabled: ${ORDER_LOAD_ENABLED:true}

  ai:
    forecast-url: ${AI_FORECAST_URL:http://127.0.0.1:8090}
    sync-health-url: ${AI_SYNC_HEALTH_URL:http://127.0.0.1:8091}
    dynamic-buffer-enabled: false
