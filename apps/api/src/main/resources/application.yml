server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: ${SESSION_TIMEOUT:60m}
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: octoflow-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OctoFlowHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  security:
    csrf:
      enabled: true

logging:
  structured:
    format:
      console: logstash

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /api/v1/openapi.json
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# OctoFlow Application Domain Configuration
app:
  security:
    cors-origins: ${CORS_ALLOWED_ORIGINS:}
    cookie-secure: ${COOKIE_SECURE:true}

  idempotency:
    ttl: ${IDEMPOTENCY_TTL:PT24H}
    cleanup-interval-ms: ${IDEMPOTENCY_CLEANUP_INTERVAL_MS:3600000}

  orders:
    # POS unpaid-order hold TTL. The expiry worker sweeps only POS + PLACED + PENDING orders.
    hold-ttl: ${ORDER_HOLD_TTL:PT15M}
    expiry-batch-size: ${ORDER_EXPIRY_BATCH_SIZE:100}

  sync:
    mode: ${INVENTORY_SYNC_MODE:eda}
    poll-interval-ms: 5000
    workers-enabled: ${SYNC_WORKERS_ENABLED:true}
    outbox-batch-size: ${SYNC_OUTBOX_BATCH_SIZE:100}
    outbox-poll-interval-ms: ${SYNC_OUTBOX_POLL_INTERVAL_MS:1000}
    allocation-batch-size: ${SYNC_ALLOCATION_BATCH_SIZE:25}
    allocation-poll-interval-ms: ${SYNC_ALLOCATION_POLL_INTERVAL_MS:1000}
    allocation-max-attempts: ${SYNC_ALLOCATION_MAX_ATTEMPTS:5}
    job-batch-size: ${SYNC_JOB_BATCH_SIZE:50}
    job-poll-interval-ms: ${SYNC_JOB_POLL_INTERVAL_MS:1000}
    reconciliation-batch-size: ${SYNC_RECONCILIATION_BATCH_SIZE:50}
    reconciliation-interval-ms: ${SYNC_RECONCILIATION_INTERVAL_MS:60000}
    max-attempts: ${SYNC_MAX_ATTEMPTS:8}
    retry-base-ms: ${SYNC_RETRY_BASE_MS:500}
    retry-max-ms: ${SYNC_RETRY_MAX_MS:60000}
    lease-seconds: ${SYNC_LEASE_SECONDS:30}

  channels:
    shopify:
      enabled: ${SHOPIFY_ENABLED:false}
      shop-domain: ${SHOPIFY_SHOP_DOMAIN:}
      api-version: ${SHOPIFY_API_VERSION:2026-10}
      write-enabled: ${SHOPIFY_WRITE_ENABLED:false}
    woocommerce:
      enabled: ${WOOCOMMERCE_ENABLED:false}
      base-url: ${WOOCOMMERCE_BASE_URL:http://localhost:8090}
      consumer-key: ${WOOCOMMERCE_CONSUMER_KEY:}
      consumer-secret: ${WOOCOMMERCE_CONSUMER_SECRET:}
      # Inventory writes have their own switch; connecting or reading a store never enables them.
      write-enabled: ${WOOCOMMERCE_INVENTORY_WRITE_ENABLED:false}
      connect-timeout-ms: ${WOOCOMMERCE_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${WOOCOMMERCE_READ_TIMEOUT_MS:10000}
      allowed-environments: ${WOOCOMMERCE_ALLOWED_ENVIRONMENTS:sandbox,development,test}
      development-host-allowlist: ${WOOCOMMERCE_DEVELOPMENT_HOST_ALLOWLIST:localhost,127.0.0.1,::1}
    lazada:
      enabled: ${LAZADA_ENABLED:false}
      country: ${LAZADA_COUNTRY:VN}
      environment: ${LAZADA_ENVIRONMENT:sandbox}
      app-key: ${LAZADA_APP_KEY:}
      app-secret: ${LAZADA_APP_SECRET:}
      redirect-uri: ${LAZADA_REDIRECT_URI:}
      auth-base-url: ${LAZADA_AUTH_BASE_URL:https://auth.lazada.com}
      api-base-url: ${LAZADA_API_BASE_URL:https://api.lazada.vn/rest}
      frontend-base-url: ${LAZADA_FRONTEND_BASE_URL:}
      frontend-channels-path: ${LAZADA_FRONTEND_CHANNELS_PATH:/channels}
      connect-timeout-ms: ${LAZADA_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${LAZADA_READ_TIMEOUT_MS:10000}
      token-encryption-key: ${LAZADA_TOKEN_ENCRYPTION_KEY:}
      token-key-id: ${LAZADA_TOKEN_KEY_ID:v1}
      allowed-environments: ${LAZADA_ALLOWED_ENVIRONMENTS:sandbox}
      product-write-enabled: ${LAZADA_PRODUCT_WRITE_ENABLED:false}
      inventory-write-enabled: ${LAZADA_INVENTORY_WRITE_ENABLED:false}
      order-write-enabled: ${LAZADA_ORDER_WRITE_ENABLED:false}
    ebay:
      enabled: ${EBAY_ENABLED:false}
      environment: ${EBAY_ENVIRONMENT:sandbox}
    simulator:
      enabled: ${CHANNEL_SIMULATOR_ENABLED:false}

  ai:
    forecast-url: ${AI_FORECAST_URL:http://127.0.0.1:8090}
    sync-health-url: ${AI_SYNC_HEALTH_URL:http://127.0.0.1:8091}
    dynamic-buffer-enabled: false
