server:
  port: ${SERVER_PORT:8085}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:60m}
      cookie:
        secure: ${COOKIE_SECURE:false}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/octoflow?sslmode=disable}
    username: ${DB_USER:octoflow}
    password: ${DB_PASSWORD:octoflow_dev}

app:
  security:
    cors-origins: "http://localhost:5174,http://127.0.0.1:5174,capacitor://localhost,https://localhost"
    cookie-secure: ${COOKIE_SECURE:false}
  channels:
    lazada:
      enabled: false
      app-key: ""
      app-secret: ""
      redirect-uri: ""
      frontend-base-url: ""
      token-encryption-key: ""
      product-write-enabled: false
      inventory-write-enabled: false
      order-write-enabled: false
  dev-seed:
    admin-password: ${DEV_ADMIN_PASSWORD:DevOnly-Admin@123}
    staff-password: ${DEV_STAFF_PASSWORD:DevOnly-Staff@123}
